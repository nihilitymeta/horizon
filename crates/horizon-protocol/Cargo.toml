[package]
name = "horizon-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon's Minecraft Java Edition 26.3 network protocol (version 777)"

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-world = { path = "../horizon-world" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
serde_json = "1.0.151"
log = "0.4"
# The shared secret and RSA padding (OS randomness) and the server hash.
getrandom = "0.3"
sha1 = "0.10"
# Secure chat: SHA256withRSA message signatures.
sha2 = "0.10"
# AES-NI at run time on x86 for the connection cipher (crypto/blocks.rs).
aes = "0.8.4"
# WebSocket connections (websocket/): the handshake's key and, for `wss://`, TLS on ring with the Mozilla
# roots, all already in the lockfile through ureq and horizon-server.
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# The name servers of Windows' network adapters, for Minecraft SRV redirects.
[target.'cfg(windows)'.dependencies]
ipconfig = "0.3.4"

# Its own name, not `probe`: Cargo copies every crate's examples into one target/<profile>/examples.
[[example]]
name = "protocol_probe"
path = "examples/probe.rs"

[[example]]
name = "item_wire_probe"
path = "examples/item_wire_probe.rs"

[lints]
workspace = true

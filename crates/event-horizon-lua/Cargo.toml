[package]
name = "event-horizon-lua"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Event Horizon's Lua runtime: one built-in host mod that runs .hlua mods (sandboxed Luau) on the mod API"
autobins = false
autoexamples = false
autotests = false

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
horizon-hooks = { path = "../horizon-hooks" }
horizon-mod-api = { path = "../horizon-mod-api" }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false }
horizon-world = { path = "../horizon-world" }
event-horizon-lua-convert = { path = "../event-horizon-lua-convert" }
# Luau, built from source, no system library; one state per mod and side, shared across threads.
mlua = { version = "0.12", features = ["luau", "vendored", "send"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
sha2 = "0.10"
log = "0.4"

[dev-dependencies]
tempfile = "3.27.0"
# Scoped mod installation for tests (`mod_platform::testing`), so a test can install item tables.
horizon-mod-api = { path = "../horizon-mod-api", features = ["testing"] }
# Block definitions, so a test can build a block key and a block state.
horizon-mod-runtime = { path = "../horizon-mod-runtime" }

[lints]
workspace = true

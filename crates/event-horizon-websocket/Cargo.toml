[package]
name = "event-horizon-websocket"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Event Horizon's WebSocket transport for Minecraft connections"

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-transport = { path = "../horizon-transport" }
base64 = "0.22"
getrandom = "0.3"
sha1 = "0.10"
log = "0.4"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[lints]
workspace = true

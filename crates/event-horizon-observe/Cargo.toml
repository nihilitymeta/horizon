[package]
name = "event-horizon-observe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The observation store and wire the developer tools read"
autobins = false
autoexamples = false
autotests = false

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-world = { path = "../horizon-world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }

[lints]
workspace = true

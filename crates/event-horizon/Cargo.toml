[package]
name = "event-horizon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Event Horizon's game executable: the platform's game with Event Horizon's built-in mods registered"
autobins = false
autoexamples = false
autotests = false

[[bin]]
name = "event-horizon"
path = "src/main.rs"
test = false

[dependencies]
horizon-client = { path = "../horizon-client" }
horizon-game = { path = "../horizon-game" }
horizon-mod-host = { path = "../horizon-mod-host" }
horizon-mod-api = { path = "../horizon-mod-api" }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false }
horizon-guest-stack = { path = "../horizon-guest-stack" }
event-horizon-lua = { path = "../event-horizon-lua" }
event-horizon-dev-tools = { path = "../event-horizon-dev-tools" }
log = "0.4"

[build-dependencies]
# The build script runs on the host, but embeds resources based on the target OS.
winresource = "0.1"

[lints]
workspace = true

[package]
name = "event-horizon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Event Horizon game program"
autobins = false
autoexamples = false
autotests = false

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
event-horizon-extras = { path = "../event-horizon-extras", default-features = false }
event-horizon-lua = { path = "../event-horizon-lua", default-features = false }
event-horizon-websocket = { path = "../event-horizon-websocket" }
horizon-threads = { path = "../horizon-threads" }
horizon-mods = { path = "../horizon-mods" }

[target.'cfg(windows)'.build-dependencies]
# The icon resource in the .exe (build.rs).
winresource = "0.1"

[features]
default = ["audio", "controllers"]
audio = ["horizon-client/audio"]
controllers = ["horizon-client/controllers"]
rng-trace = ["horizon-client/rng-trace"]
# Rust's allocations go to the system heap instead of mimalloc, where heap profilers that replace
# malloc (heaptrack, valgrind's massif) see them. For profiling only: mimalloc is faster.
system-allocator = []
# mimalloc with a tag on each block: `horizon-ctl memory` lists the live heap by startup step and
# thread (`heap_by_tag_mb`). For measuring only: each block costs 16 bytes more.
alloc-census = ["horizon-client/alloc-census"]
# Compatibility with earlier experiment commands: main already uses mimalloc.
windows-mimalloc = []
# Opt-in Windows heap experiment; see docs/windows-allocators.md.
windows-segment-heap = []

[[bin]]
name = "horizon-client"
path = "src/main.rs"

[[test]]
name = "launch_api"
path = "tests/launch_api.rs"

[lints]
workspace = true

[dev-dependencies]
horizon-core = { path = "../horizon-core" }
serde_json = "1.0.151"

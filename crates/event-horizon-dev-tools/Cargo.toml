[package]
name = "event-horizon-dev-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Event Horizon's developer tools: the egui windows over the world and the server half that feeds them"
autobins = false
autoexamples = false
autotests = false

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
horizon-client-core = { path = "../horizon-client-core" }
horizon-core = { path = "../horizon-core" }
horizon-world = { path = "../horizon-world" }
horizon-mod-api = { path = "../horizon-mod-api" }
horizon-mod-render = { path = "../horizon-mod-render" }
event-horizon-observe = { path = "../event-horizon-observe" }
horizon-client-input = { path = "../horizon-client-input" }
serde_json = "1.0.151"
log = "0.4"
winit = "0.30.13"
# The windows draw with egui over the world: HORIZON_DEV_TOOLS=1.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }

[dev-dependencies]
horizon-mod-package = { path = "../horizon-mod-package", default-features = false }
tempfile = "3.27.0"

[lints]
workspace = true

[package]
name = "event-horizon-lua-convert"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Conversions between Lua values and the mod API's value types (the conversion layer of the Lua host)"
autobins = false
autoexamples = false
autotests = false

[dependencies]
horizon-mod-api = { path = "../horizon-mod-api" }
mlua = { version = "0.12", features = ["luau", "vendored", "send"] }
serde_json = "1"
log = "0.4"

[lints]
workspace = true

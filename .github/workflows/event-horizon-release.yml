name: event horizon release
# Event Horizon's releases (docs/event-horizon-releases.md): pushing a tag eh-v<version> on engine-work builds the game
# and the launcher for Windows x64 on GitHub's runners and publishes them as that tag's GitHub release. Another platform
# is another row in the matrix (Linux x86_64 needs the apt step below). The launcher's
# GitHub sources install a release on an installed Horizon version's game files, as an imported build. Only the
# programs are built here: the game files (exporters, prepared data) come from Horizon's own releases.
#   git tag eh-v0.1.0 && git push origin eh-v0.1.0
on:
  push:
    tags: ['eh-v*']
permissions:
  contents: read
concurrency:
  group: event-horizon-release-${{ github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      # Event Horizon's own Azure app for Microsoft sign-in (docs/microsoft-account.md): the repository variable
      # HORIZON_MSA_CLIENT_ID, never another app's. Unset, the launcher can't sign in, so it can't start the game.
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux audio and input libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          workspaces: |
            . -> target
            launcher -> target
      # Built as a build from source (no HORIZON_VERSION): the programs don't call themselves Horizon releases in
      # crash reports. The launcher records which Event Horizon release a build came from.
      - name: Build the game, horizon-ctl and cargo-horizon-mod
        shell: bash
        run: |
          cargo build --release --locked -p horizon-client -p horizon-client-lib --bin horizon-client --bin horizon-ctl
          cargo build --release --locked -p cargo-horizon-mod
      - name: Build the launcher
        shell: bash
        working-directory: launcher
        # The release it belongs to: the launcher updates itself to a newer eh-v release (game_sources.rs).
        env:
          HORIZON_LAUNCHER_TAG: ${{ github.ref_name }}
        run: |
          export HORIZON_LAUNCHER_VERSION="${HORIZON_LAUNCHER_TAG#eh-v}"
          [[ -n "$HORIZON_MSA_CLIENT_ID" ]] || echo "::warning::HORIZON_MSA_CLIENT_ID is not set: this launcher can't sign in to Microsoft, so it can't start the game"
          cargo build --release --locked
      - name: The game starts
        shell: bash
        run: target/release/horizon-client${{ matrix.exe }} --help | grep -q -- '--resources'
      - name: Package
        shell: bash
        run: |
          dir="event-horizon-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          for program in horizon-client horizon-ctl cargo-horizon-mod; do
            cp "target/release/$program${{ matrix.exe }}" "dist/$dir/"
          done
          cp "launcher/target/release/horizon-launcher${{ matrix.exe }}" "dist/$dir/"
          cd dist
          if [[ "${{ runner.os }}" == Windows ]]; then 7z a -tzip "$dir.zip" "$dir" >/dev/null; else tar -czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/event-horizon-${{ matrix.name }}.*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum event-horizon-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Event Horizon ${TAG#eh-}" \
            --notes "Event Horizon ${TAG#eh-}, built from $GITHUB_SHA. Install it from the launcher's GitHub sources." \
            dist/event-horizon-* dist/SHA256SUMS

name: event horizon release
# Event Horizon's releases (docs/event-horizon-releases.md): the game and the launcher for Windows x64 and Linux x86_64,
# built on GitHub's runners and published as a GitHub release, which the launchers' GitHub sources install. Only the
# programs are built here: the game files (exporters, prepared data) come from Horizon's own releases.
# - A version of your choosing: push a tag eh-v<version> on engine-work.
#     git tag eh-v0.1.0 && git push origin eh-v0.1.0
# - A nightly, eh-nightly-<date>: every day at 09:00 UTC (4am Eastern in winter, 5am in summer), from engine-work, when it
#   changed since the last release. The repository variable NIGHTLY_PAUSED=1 skips nightlies until it is removed:
#     gh variable set NIGHTLY_PAUSED -R whos-carmen/horizon --body 1      # gh variable delete NIGHTLY_PAUSED to resume
#   Run one now from the Actions tab or with: gh workflow run "event horizon release" -R whos-carmen/horizon
# Another platform is another row in the build matrix (a Linux row needs the apt step below).
on:
  push:
    tags: ['eh-v*']
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-horizon-release
  cancel-in-progress: false
jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      go: ${{ steps.decide.outputs.go }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PAUSED: ${{ vars.NIGHTLY_PAUSED }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/eh-v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$PAUSED" == 1 ]]; then
            echo "::notice::NIGHTLY_PAUSED=1: no nightly"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .target_commitish 2>/dev/null || true)
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$last" == "$GITHUB_SHA" ]]; then
            echo "::notice::engine-work is what the last release built: no nightly"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="eh-nightly-$(date -u +%Y-%m-%d)"
          # A second nightly on one day (a run by hand) gets -2, -3...
          n=1; base=$tag
          while gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; do n=$((n+1)); tag="$base-$n"; done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"
  build:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: .exe
          - os: ubuntu-latest
            name: linux-x86_64
            exe: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      # Event Horizon's own Azure app for Microsoft sign-in (docs/event-horizon-sign-in.md): the repository variable
      # HORIZON_MSA_CLIENT_ID, never another app's. Unset, the launcher can't sign in.
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux audio and input libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          workspaces: |
            . -> target
            launcher -> target
      # Built as a build from source (no HORIZON_VERSION): the programs don't call themselves Horizon releases in
      # crash reports. The launcher records which Event Horizon release a build came from.
      - name: Build the game, horizon-ctl and cargo-horizon-mod
        shell: bash
        run: |
          cargo build --release --locked -p event-horizon -p horizon-client-lib --bin horizon-client --bin horizon-ctl
          cargo build --release --locked -p cargo-horizon-mod
      - name: The game starts
        shell: bash
        run: target/release/horizon-client${{ matrix.exe }} --help | grep -q -- '--resources'
      - name: Build the launcher
        shell: bash
        working-directory: launcher
        # The release it belongs to, and when it was built: the launcher updates itself to a release published after
        # it was built (game_sources.rs).
        run: |
          [[ -n "$HORIZON_MSA_CLIENT_ID" ]] || echo "::warning::HORIZON_MSA_CLIENT_ID is not set: this launcher can't sign in to Microsoft"
          export HORIZON_LAUNCHER_TAG="$TAG" HORIZON_LAUNCHER_VERSION="${TAG#eh-}"
          export HORIZON_LAUNCHER_BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          dir="event-horizon-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          for program in horizon-client horizon-ctl cargo-horizon-mod; do
            cp "target/release/$program${{ matrix.exe }}" "dist/$dir/"
          done
          cp "launcher/target/release/horizon-launcher${{ matrix.exe }}" "dist/$dir/"
          cd dist
          if [[ "${{ runner.os }}" == Windows ]]; then 7z a -tzip "$dir.zip" "$dir" >/dev/null; else tar -czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/event-horizon-${{ matrix.name }}.*
          if-no-files-found: error
  publish:
    needs: [decide, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum event-horizon-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          case "$TAG" in
            eh-nightly-*) title="Event Horizon Nightly ${TAG#eh-nightly-}" ;;
            *) title="Event Horizon ${TAG#eh-v}" ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" \
            --notes "$title, built from $GITHUB_SHA. Install it from the launcher's GitHub sources (docs/event-horizon-releases.md)." \
            dist/event-horizon-* dist/SHA256SUMS

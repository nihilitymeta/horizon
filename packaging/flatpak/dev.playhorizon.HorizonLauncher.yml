# Packages the Linux launcher as a Flatpak: one file to install (`flatpak install horizon-launcher.flatpak`), with the
# libraries from the freedesktop runtime rather than the player's distribution, and the JRE the vanilla exporters and
# `horizon-prepare` run on. The release workflow's Linux run builds it with `packaging/flatpak/build.sh`; it is not a
# Flathub submission, so the sandbox is as wide as a launcher needs (the player's own folders, the network, the GPU).
#
# The binary is built inside the SDK, so it links the runtime's libraries and no distribution's; `horizon-launcher.sh`
# is the command, which points the launcher at the player's own data folder (so versions, worlds and settings are the
# ones a distribution build uses) and at the bundled JRE. Built without `HORIZON_LAUNCHER_TAG`, the launcher is a
# "built by hand" build: it never replaces itself. The bundle has no repository, so a newer one is installed over it
# (`flatpak install --reinstall`), which is what the release notes say.
app-id: dev.playhorizon.HorizonLauncher
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: horizon-launcher
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # The player's own folders: the Minecraft install the vanilla exporters read, the versions and worlds the launcher
  # writes, and the game's own files. A launcher is the program that manages them; a narrower sandbox would hide the
  # installation the player already has.
  - --filesystem=home
  # Sign-in uses the system browser through the portal; notifications and the keyring are the launcher's own.
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  # Microsoft sign-in: Horizon's own Azure app, as `HORIZON_MSA_CLIENT_ID` in the distribution build
  # (launcher/src/account.rs). `build.sh` puts the release's value here; without one the launcher says it has no
  # sign-in.
  - --env=HORIZON_MSA_CLIENT_ID=@MSA_CLIENT_ID@
modules:
  - name: horizon-launcher
    buildsystem: simple
    build-options:
      # Cargo fetches the launcher's crates while it builds. The bundle itself needs no network beyond its own
      # version checks.
      build-args:
        - --share=network
      env:
        # The release this bundle was built for (the release workflow's tag and time), so the launcher names itself
        # `Event Horizon <version>` rather than a build by hand. Empty when a developer builds it in a checkout.
        HORIZON_LAUNCHER_TAG: '@LAUNCHER_TAG@'
        HORIZON_LAUNCHER_VERSION: '@LAUNCHER_VERSION@'
        HORIZON_LAUNCHER_BUILT: '@LAUNCHER_BUILT@'
    build-commands:
      # Rust is pinned at two levels, and nothing is a script downloaded at build time. `rustup-init` is one of the
      # `sources` below: flatpak-builder fetches it and checks its sha256, per architecture (to bump it, take the new
      # hashes from https://static.rust-lang.org/rustup/dist/<target>/rustup-init.sha256). It then installs toolchain
      # 1.99.1, the version this tree builds with (the SDK's rust extension lags behind it), and rustup checks that
      # toolchain against its own published manifest hashes. Bump the toolchain together with the rustup-init hashes
      # when the workspace needs a newer one. The cargo crates still come from the network while the launcher builds
      # (`--share=network` above); vendoring them with flatpak-cargo-generator would make the build fully offline, left
      # for later. One shell, since `buildsystem: simple` runs each command in its own.
      - |
        set -eu
        export RUSTUP_HOME=/run/build/horizon-launcher/rustup CARGO_HOME=/run/build/horizon-launcher/cargo
        chmod +x rustup-init
        ./rustup-init -y --profile minimal --default-toolchain 1.99.1 --no-modify-path
        export PATH="$CARGO_HOME/bin:$PATH"
        cd launcher
        cargo build --release --locked
      - install -Dm755 launcher/target/release/horizon-launcher /app/lib/horizon-launcher/horizon-launcher
      - install -Dm755 packaging/flatpak/horizon-launcher.sh /app/bin/horizon-launcher
      - install -Dm644 packaging/flatpak/dev.playhorizon.HorizonLauncher.desktop /app/share/applications/dev.playhorizon.HorizonLauncher.desktop
      - install -Dm644 packaging/flatpak/dev.playhorizon.HorizonLauncher.metainfo.xml /app/share/metainfo/dev.playhorizon.HorizonLauncher.metainfo.xml
      - install -Dm644 packaging/icons/hicolor/512x512/apps/horizon.png /app/share/icons/hicolor/512x512/apps/dev.playhorizon.HorizonLauncher.png
      # The JRE the launcher offers as an installed runtime: `horizon-prepare`'s exporters and the game's own
      # `run` need one, and a sandbox sees no distribution's. The extension's own installer puts a minimal JRE at
      # /app/jre, the `JAVA_HOME` the command sets.
      - /usr/lib/sdk/openjdk21/install.sh
    sources:
      - type: archive
        path: horizon-source.tar.gz
      # rustup-init for each architecture the bundle builds, pinned by sha256 (see the build-commands above).
      - type: file
        url: https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
        sha256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
        dest-filename: rustup-init
        only-arches:
          - x86_64
      - type: file
        url: https://static.rust-lang.org/rustup/dist/aarch64-unknown-linux-gnu/rustup-init
        sha256: 9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282
        dest-filename: rustup-init
        only-arches:
          - aarch64
